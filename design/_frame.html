<!doctype html><html><body style="margin:0;background:#888"><iframe id="f" style="border:0;width:var(--w,390px);height:800px;display:block;background:#fff"></iframe>
<script>const p=new URLSearchParams(location.search);if(p.get('w'))f.style.setProperty('--w',p.get('w')+'px');f.src=p.get('u');f.onload=()=>{const d=f.contentDocument;f.style.height=d.documentElement.scrollHeight+'px';document.title='w='+d.documentElement.scrollWidth}</script></body></html>
